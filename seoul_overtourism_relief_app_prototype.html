<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iOS Native Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Seoul Calm" />
  <meta name="theme-color" content="#0f172a" />
  <title>Seoul Calm — Overtourism Relief App Prototype</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Multi-script Typography: Inter, Noto Sans KR, Noto Sans JP, Noto Sans SC, Noto Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --font-sans: 'Inter', 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', 'Noto Sans Arabic', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: #0b1120;
      background-image:
        radial-gradient(circle at 18% 18%, rgba(56, 189, 248, 0.13) 0%, transparent 42%),
        radial-gradient(circle at 82% 80%, rgba(16, 185, 129, 0.11) 0%, transparent 45%),
        linear-gradient(180deg, #090d16 0%, #0f172a 55%, #111827 100%);
      color: #f8fafc;
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Desktop >= 900px: Realistic iPhone 16 Pro Hardware Frame */
    @media (min-width: 900px) {
      body {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 2.25rem;
        padding: 1.5rem;
      }

      .iphone-chassis {
        width: 393px;
        height: 852px;
        max-height: 93vh;
        border-radius: 54px;
        background: linear-gradient(145deg, #2e2e32 0%, #18181b 50%, #09090b 100%);
        padding: 12px;
        box-shadow:
          0 35px 90px -15px rgba(0, 0, 0, 0.88),
          0 0 0 1px rgba(255, 255, 255, 0.15),
          inset 0 0 2px 1px rgba(255, 255, 255, 0.22);
        position: relative;
        flex-shrink: 0;
      }

      .iphone-chassis::before {
        content: "";
        position: absolute;
        left: -3px;
        top: 138px;
        width: 3px;
        height: 32px;
        background: #3f3f46;
        border-radius: 3px 0 0 3px;
        box-shadow: 0 52px 0 #3f3f46, 0 96px 0 #3f3f46;
      }

      .iphone-chassis::after {
        content: "";
        position: absolute;
        right: -3px;
        top: 188px;
        width: 3px;
        height: 76px;
        background: #3f3f46;
        border-radius: 0 3px 3px 0;
      }

      .iphone-screen {
        width: 100%;
        height: 100%;
        border-radius: 43px;
        overflow: hidden;
      }

      .ios-status-bar {
        display: flex;
      }

      .mobile-demo-fab {
        display: none;
      }
    }

    /* Mobile / iOS < 900px: Native Edge-to-Edge Full-Screen Experience */
    @media (max-width: 899px) {
      body {
        background: #f8fafc;
        padding: 0;
      }

      .iphone-chassis {
        width: 100vw;
        height: 100dvh;
        padding: 0;
        border-radius: 0;
        background: #f8fafc;
      }

      .iphone-screen {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        padding-top: env(safe-area-inset-top, 0px);
      }

      .ios-status-bar {
        display: none;
      }

      .app-bottom-nav {
        padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)) !important;
      }

      /* Desktop sidebar hidden by default on mobile; shown as slide-up sheet when toggled */
      .presenter-sidebar {
        position: fixed;
        inset: 0;
        z-index: 60;
        background: rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(6px);
        display: none;
        align-items: flex-end;
        justify-content: center;
        padding: 0.75rem;
      }

      .presenter-sidebar.mobile-open {
        display: flex;
      }

      .presenter-card {
        max-height: 84dvh;
        overflow-y: auto;
        width: 100%;
      }
    }

    .iphone-screen {
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .phone-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .phone-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .phone-scroll::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { transform: scale(0.84); opacity: 0; }
      70% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-view {
      animation: fadeSlideUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-pop {
      animation: popIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>

  <!-- =====================================================================

       ===================================================================== -->
  <main class="iphone-chassis" aria-label="Seoul Calm Mobile Prototype">
    <div id="iphone-screen" class="iphone-screen" dir="ltr">

        <!-- Desktop Hardware Status Bar -->
        <div class="ios-status-bar items-center justify-between px-6 pt-3 pb-1.5 text-[12px] font-semibold text-slate-900" dir="ltr">
          <span>9:41</span>
          <div class="w-28 h-7 bg-black rounded-full flex items-center justify-between px-3 shadow-inner">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-[10px] font-semibold text-slate-300 tracking-tight">LIVE</span>

          </div>
          <div class="flex items-center gap-1.5 text-slate-900">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M2 20h2v-4H2v4zm4 0h2v-7H6v7zm4 0h2V10h-2v10zm4 0h2V6h-2v14zm4 0h2V2h-2v18z"/></svg>
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm-4.9-2.3l1.4 1.4C9.4 16.4 10.6 16 12 16s2.6.4 3.5 1.1l1.4-1.4C15.6 14.6 13.9 14 12 14s-3.6.6-4.9 1.7zm-2.8-2.8l1.4 1.4C7.3 13 9.5 12 12 12s4.7 1 6.3 2.3l1.4-1.4C17.7 11.1 15 10 12 10s-5.7 1.1-7.7 2.9z"/></svg>

              <div class="w-full h-full bg-slate-900 rounded-[1px]"></div>

        <!-- App Navigation Header -->

          <!-- Sleek 10-Language Selector Dropdown Button -->

              <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- Dropdown Popover with All 10 Languages -->
            <div

        </div>
      </header>

                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/>

      const loc = SPOTS_L10N[id][state.lang] || SPOTS_L10N[id].en;
      return {
        ...base,
        name: loc[0],
        district: loc[1],
        desc: loc[2],
        categoryLabel: L().categories[base.category]
      };
    }

    function getAllSpots() {
      return SPOTS_BASE.map((b) => getSpot(b.id));
    }

    function getTransit(id) {
      const base = TRANSIT_BASE.find((t) => t.id === id);
      if (!base) return null;
      return {
        ...base,
        name: TRANSIT_L10N[id][state.lang] || TRANSIT_L10N[id].en,
        lineLabel: L().lines[base.line] || base.line
      };
    }

    // -----------------------------------------------------------------------
    // 7. CORE ALGORITHMS (HAVERSINE, 3-TIER CROWD, F1, F3, F4)
    // -----------------------------------------------------------------------
    function haversineM(lat1, lon1, lat2, lon2) {
      const r = 6371000.0;
      const p1 = (lat1 * Math.PI) / 180;
      const p2 = (lat2 * Math.PI) / 180;
      const dphi = p2 - p1;
      const dl = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dphi / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
      return 2 * r * Math.asin(Math.sqrt(a));
    }

    function nearestTransit(spot, kind) {
      let best = null;
      for (const b of TRANSIT_BASE) {
        if (b.kind !== kind) continue;
        const d = haversineM(spot.lat, spot.lon, b.lat, b.lon);
        if (!best || d < best.distance_m) {
          best = { ...getTransit(b.id), distance_m: Math.round(d) };
        }
      }
      return best && best.distance_m <= 1500 ? best : null;
    }

    function getCrowdTier(score) {
      const c = L().crowd;
      if (score < 0.3) {
        return {
          code: "quiet",
          label: c.quiet,
          pct: Math.round(score * 100),
          pillClass: "bg-emerald-50 text-emerald-700 border-emerald-200",
          dotClass: "bg-emerald-500",
          barClass: "bg-emerald-500",
          accentHex: "#10b981"
        };
      }
      if (score < 0.6) {
        return {
          code: "normal",
          label: c.normal,
          pct: Math.round(score * 100),
          pillClass: "bg-amber-50 text-amber-700 border-amber-200",
          dotClass: "bg-amber-500",
          barClass: "bg-amber-500",
          accentHex: "#f59e0b"
        };
      }
      return {
        code: "crowded",
        label: c.crowded,
        pct: Math.round(score * 100),
        pillClass: "bg-rose-50 text-rose-700 border-rose-200",
        dotClass: "bg-rose-500",
        barClass: "bg-rose-500",
        accentHex: "#ef4444"
      };
    }

    function ratioToTier(ratio) {
      if (ratio >= 1.3) return getCrowdTier(0.95);
      if (ratio <= 0.8) return getCrowdTier(0.15);
      return getCrowdTier(0.40);
    }

    function getSpotForecast(spot) {
      const currentCrowd = getCrowdTier(spot.crowd_score);
      let todayTier = ratioToTier(spot.r7);
      if (currentCrowd.code === "crowded") {
        todayTier = getCrowdTier(0.95);
      }
      const tomorrowTier = ratioToTier(spot.r3);

      const series = [];
      const baseVal = 45;
      for (let i = 0; i < 35; i++) {
        const wave = Math.sin(i * 0.75 + spot.id) * 4.5 + Math.cos(i * 0.35) * 3;
        if (i < 28) {
          series.push(Math.max(15, baseVal + wave));
        } else if (i < 32) {
          series.push(Math.max(15, baseVal * spot.r7 + wave * 0.7));
        } else {
          series.push(Math.max(15, baseVal * spot.r3 + wave * 0.6));
        }
      }

      return {
        today: todayTier,
        tomorrow: tomorrowTier,
        r7: spot.r7,
        r3: spot.r3,
        series
      };
    }

    function getAlternatives(spot, limit = 3) {
      const all = getAllSpots();
      const cands = all.filter(
        (c) =>
          c.category === spot.category &&
          c.id !== spot.id &&
          c.rank_100 > spot.rank_100 &&
          c.crowd_score < 0.7
      );

      const scored = cands.map((c) => {
        const km = haversineM(spot.lat, spot.lon, c.lat, c.lon) / 1000;
        const total =
          0.4 * (Math.min(c.rank_100, 100) / 100) +
          0.4 * (1 - c.crowd_score) +
          0.2 * (1 - Math.min(km, 20) / 20);
        return { spot: c, km: Math.round(km * 10) / 10, total };
      });

      scored.sort((a, b) => b.total - a.total);
      return scored.slice(0, limit);
    }

    function computePersonalityResult(answers) {
      const byAxis = { lively: [], city: [], trend: [] };
      for (const q of QUESTIONS_DATA) {
        const val = answers[q.id] ?? -1;
        byAxis[q.axis].push(val);
      }
      const avg = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
      const lively = avg(byAxis.lively);
      const city = avg(byAxis.city);
      const trend = avg(byAxis.trend);

      const code =
        (lively >= 0 ? "L" : "Q") +
        (city >= 0 ? "C" : "N") +
        (trend >= 0 ? "T" : "H");

      const allSpots = getAllSpots();
      const ranked = allSpots
        .map((s) => {
          const dist = Math.sqrt(
            (lively - s.v_lively) ** 2 +
            (city - s.v_city) ** 2 +
            (trend - s.v_trend) ** 2
          );
          const sim = 1 - dist / (2 * Math.sqrt(3));
          const total = 0.7 * sim + 0.3 * (1 - s.crowd_score) + (s.is_hidden ? 0.05 : 0);
          return {
            spot: s,
            similarityPct: Math.round(sim * 100),
            total
          };
        })
        .sort((a, b) => b.total - a.total);

      return {
        code,
        vec: { lively, city, trend },
        recommendations: ranked.slice(0, 5)
      };
    }

    function renderQuizView() {
      const ui = L();
      const answeredCount = Object.keys(state.quizAnswers).length;
      const allAnswered = answeredCount === QUESTIONS_DATA.length;
      const fwdArrow = state.lang === "ar" ? "←" : "→";

      return `
        <div class="p-4 space-y-4 pb-8 animate-view">
          <div class="rounded-3xl bg-gradient-to-br from-indigo-600 to-violet-700 text-white p-4 shadow-md">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[10px] font-extrabold tracking-wider bg-white/15 px-2.5 py-0.5 rounded-full">
                ${ui.quizBadge}
              </span>
              <button
                onclick="quickAutoFillQuiz()"
                class="px-2.5 py-1 rounded-full bg-white text-indigo-700 hover:bg-indigo-50 text-[10px] font-extrabold shadow-xs transition cursor-pointer"
              >
                ⚡ ${ui.quizAutoFill}
              </button>
            </div>
            <h2 class="text-base font-extrabold mt-2">${ui.quizTitle}</h2>
            <div class="mt-3 flex items-center gap-2">
              <div class="flex-1 h-2 bg-black/25 rounded-full overflow-hidden">
                <div class="h-full bg-emerald-300 rounded-full transition-all duration-300" style="width: ${(answeredCount / QUESTIONS_DATA.length) * 100}%"></div>
              </div>
              <span class="text-[11px] font-extrabold">${answeredCount}/${QUESTIONS_DATA.length}</span>
            </div>
          </div>

          ${state.quizResult ? renderQuizResultCard(state.quizResult) : ""}

          <div class="space-y-3">
            ${QUESTIONS_DATA.map((q) => {
              const selected = state.quizAnswers[q.id];
              const qLoc = q.l10n[state.lang] || q.l10n.en;
              const axisLabels = {
                lively: `${ui.axisQuiet} / ${ui.axisLively}`,
                city: `${ui.axisNature} / ${ui.axisCity}`,
                trend: `${ui.axisHeritage} / ${ui.axisTrendy}`
              };
              return `
                <div class="bg-white rounded-3xl p-4 border border-slate-200/80 shadow-2xs space-y-2.5">
                  <div class="flex items-center justify-between">
                    <span class="text-[10px] font-extrabold text-indigo-600">Q${q.id} · ${axisLabels[q.axis]}</span>
                    ${selected !== undefined ? `<span class="text-[10px] font-bold text-emerald-600">✓</span>` : ""}
                  </div>
                  <h3 class="text-xs font-extrabold text-slate-900">${qLoc[0]}</h3>
                  <div class="grid grid-cols-1 gap-2">
                    ${["A", "B"]
                      .map((choiceKey, idx) => {
                        const score = q.scores[choiceKey];
                        const isPicked = selected === score;
                        return `
                          <button
                            onclick="answerQuiz(${q.id}, ${score})"
                            class="w-full text-start px-3.5 py-2.5 rounded-2xl border text-xs font-semibold transition cursor-pointer flex items-center justify-between gap-2 ${
                              isPicked
                                ? "bg-indigo-600 text-white border-indigo-600 shadow-xs"
                                : "bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200"
                            }"
                          >
                            <span>${qLoc[idx + 1]}</span>
                            <span class="text-[10px] font-extrabold opacity-80 shrink-0">${choiceKey}</span>
                          </button>
                        `;
                      })
                      .join("")}
                  </div>
                </div>
              `;
            }).join("")}
          </div>

          <button
            onclick="submitQuiz()"
            class="w-full py-3.5 rounded-2xl font-extrabold text-xs shadow-md transition cursor-pointer ${
              allAnswered ? "bg-slate-900 hover:bg-slate-800 text-white" : "bg-slate-200 text-slate-500"
            }"
          >
            ${
              allAnswered
                ? `${ui.submitQuizBtn} ${fwdArrow}`
                : `${ui.answerAllPrompt} (${answeredCount}/${QUESTIONS_DATA.length})`
            }
          </button>
        </div>
      `;
    }

    function renderQuizResultCard(res) {
      const ui = L();
      const typeLoc = TYPES_L10N[res.code][state.lang] || TYPES_L10N[res.code].en;
      const pct = (val) => Math.round(((val + 1) / 2) * 100);

      // Re-compute localized top 5 dynamically when language switches
      const fresh = computePersonalityResult(state.quizAnswers);

      return `
        <div id="quiz-result-card" class="rounded-3xl bg-white p-4 border-2 border-indigo-500 shadow-md space-y-4 animate-pop">
          <div class="flex items-start justify-between gap-2">
            <div>
              <span class="px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 text-[11px] font-extrabold font-mono">
                ${ui.typePrefix} ${res.code}
              </span>
              <h3 class="text-base font-extrabold text-slate-900 mt-1.5">${typeLoc[0]}</h3>
            </div>
            <button
              onclick="resetQuizOnly()"
              class="text-[11px] font-bold text-slate-400 hover:text-slate-700 cursor-pointer shrink-0"
            >
              ${ui.retakeBtn}
            </button>
          </div>

          <p class="text-xs text-slate-600 leading-relaxed">${typeLoc[1]}</p>

          <div class="space-y-2.5 bg-slate-50 rounded-2xl p-3 border border-slate-100" dir="ltr">
            ${[
              { left: ui.axisQuiet, right: ui.axisLively, val: res.vec.lively },
              { left: ui.axisNature, right: ui.axisCity, val: res.vec.city },
              { left: ui.axisHeritage, right: ui.axisTrendy, val: res.vec.trend }
            ]
              .map(
                (ax) => `
              <div>
                <div class="flex justify-between text-[10px] font-bold text-slate-600 mb-1">
                  <span>${ax.left}</span>
                  <span class="font-mono text-indigo-600">${ax.val >= 0 ? "+" : ""}${ax.val.toFixed(2)}</span>
                  <span>${ax.right}</span>
                </div>
                <div class="w-full h-2 bg-slate-200 rounded-full relative">
                  <div class="absolute top-1/2 -translate-y-1/2 w-3.5 h-3.5 rounded-full bg-indigo-600 border-2 border-white shadow-xs transition-all" style="left: calc(${pct(ax.val)}% - 7px)"></div>
                </div>
              </div>
            `
              )
              .join("")}
          </div>

          <div>
            <h4 class="text-xs font-extrabold text-slate-900 mb-2">${ui.top5Title}</h4>
            <div class="space-y-2">
              ${fresh.recommendations
                .map((item, idx) => {
                  const s = item.spot;
                  const tier = getCrowdTier(s.crowd_score);
                  return `
                    <button
                      onclick="selectSpot(${s.id})"
                      class="w-full text-start p-2.5 rounded-2xl bg-slate-50 hover:bg-indigo-50/70 border border-slate-200/80 flex items-center justify-between gap-2 transition cursor-pointer"
                    >
                      <div class="flex items-center gap-2.5 min-w-0">
                        <span class="w-5 h-5 rounded-full bg-slate-900 text-white text-[10px] font-extrabold flex items-center justify-center shrink-0">${idx + 1}</span>
                        <div class="min-w-0">
                          <div class="text-xs font-extrabold text-slate-900 truncate">${s.name}</div>
                          <div class="text-[10px] text-slate-500">${item.similarityPct}% ${ui.vibeMatchPct} · ${s.is_hidden ? ui.hiddenBadge : `#${s.rank_100}`}</div>
                        </div>
                      </div>
                      <span class="shrink-0 px-2 py-0.5 rounded-full text-[10px] font-extrabold border ${tier.pillClass}">
                        ${tier.label}
                      </span>
                    </button>
                  `;
                })
                .join("")}
            </div>
          </div>
        </div>
      `;
    }

    function answerQuiz(qId, score) {
      state.quizAnswers[qId] = score;
      renderApp();
    }

    function submitQuiz() {
      if (Object.keys(state.quizAnswers).length < QUESTIONS_DATA.length) {
        showToast(`⚠️ ${L().toastQuizIncomplete}`, "error");
        return;
      }
      state.quizResult = computePersonalityResult(state.quizAnswers);
      renderApp();
      const vp = document.getElementById("phone-viewport");
      if (vp) vp.scrollTo({ top: 0, behavior: "smooth" });
    }

    function quickAutoFillQuiz() {
      state.quizAnswers = {
        1: -1, 2: -1, 3: -1,
        4: 1, 5: -1, 6: 1,
        7: 1, 8: 1
      };
      state.quizResult = computePersonalityResult(state.quizAnswers);
      renderApp();
      showToast(`✨ ${L().toastAutoFilled}`, "success");
    }

    function resetQuizOnly() {
      state.quizAnswers = {};
      state.quizResult = null;
      renderApp();
    }

                  `;
                })
                .join("")}
            </div>
          </div>
        </div>
      `;
    }

    // -----------------------------------------------------------------------
    // 11. F5 PHOTO VERIFICATION & F6 COLLECTION UNLOCK
    // -----------------------------------------------------------------------
    function triggerPhotoVerification(spotId) {
      const spot = getSpot(spotId);
      if (!spot) return;

      state.verifyingStep = 1;
      renderApp();

      setTimeout(() => {
        state.verifyingStep = 2;
        renderApp();
      }, 400);

      setTimeout(() => {
        state.verifyingStep = 3;
        renderApp();
      }, 800);

      setTimeout(() => {
        state.verifyingStep = 0;
        const alreadyHad = state.earnedBadges.has(spotId);
        state.earnedBadges.add(spotId);
        updateStaticChrome();
        renderApp();

        const hiddenEarnedCount = HIDDEN_COLLECTION_IDS.filter((id) =>
          state.earnedBadges.has(id)
        ).length;

        if (hiddenEarnedCount === HIDDEN_COLLECTION_IDS.length && !state.collectionUnlocked) {
          state.collectionUnlocked = true;
          openCollectionCelebrationModal();
        } else {
          const ui = L();
          showToast(
            alreadyHad
              ? `🏅 ${ui.toastReverified} (${spot.name})`
              : `🏅 ${spot.name} — ${ui.toastBadgeEarned} ${hiddenEarnedCount}/${HIDDEN_COLLECTION_IDS.length}`,
            "success"
          );
        }
      }, 1250);
    }

    function openCollectionCelebrationModal() {
      const ui = L();
      const fwdArrow = state.lang === "ar" ? "←" : "→";
      openModal(`
        <div class="space-y-4">
          <div class="w-20 h-20 mx-auto rounded-3xl bg-gradient-to-br from-amber-400 to-yellow-600 flex items-center justify-center text-4xl shadow-lg shadow-amber-500/30">
            🏆
          </div>
          <div>
            <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-extrabold tracking-wider">
              ${ui.modalCollectionBadge}
            </span>
            <h3 class="text-xl font-extrabold text-slate-900 mt-2">${ui.collection.rewardTitle}</h3>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed bg-slate-50 rounded-2xl p-3 border border-slate-100">
            ${ui.modalCollectionDesc}
          </p>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button
              onclick="closeModal()"
              class="py-2.5 px-4 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs cursor-pointer"
            >
              ${ui.closeBtn}
            </button>
            <button
              onclick="closeModal(); switchTab('badges');"
              class="py-2.5 px-4 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs cursor-pointer"
            >
              ${ui.viewTrophyBtn} ${fwdArrow}
            </button>
          </div>
        </div>
      `);
    }

    // -----------------------------------------------------------------------
    // 12. PRESENTER CONTROLS & MOBILE SHEET
    // -----------------------------------------------------------------------
    function renderPresenterLanguageGrid() {
      const grid = document.getElementById("presenter-lang-grid");
      if (!grid) return;
      grid.innerHTML = LANGUAGES.map(
        (l) => `
        <button
          onclick="setLanguage('${l.code}')"
          class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold flex items-center gap-1.5 border transition cursor-pointer ${
            state.lang === l.code
              ? "bg-emerald-500 text-slate-950 border-emerald-400 shadow-xs"
              : "bg-slate-800/80 hover:bg-slate-800 text-slate-200 border-slate-700"
          }"
        >
          <span>${l.flag}</span>
          <span class="truncate">${l.native}</span>
        </button>
      `
      ).join("");
    }

    function runDemoScene1() {
      closeModal();
      state.quizAnswers = {};
      state.quizResult = null;
      state.selectedSpotId = null;
      state.activeTab = "quiz";
      updateStaticChrome();
      renderApp();
      showToast(`🎬 ${L().toastScene1}`, "info");
    }

    function runDemoScene2() {
      closeModal();
      state.activeTab = "explore";
      state.selectedSpotId = 1;
      state.verifyingStep = 0;
      updateStaticChrome();
      renderApp();
      const vp = document.getElementById("phone-viewport");
      if (vp) vp.scrollTop = 0;
      showToast(`🔥 ${L().toastScene2}`, "info");
    }

    function runDemoScene3() {
      closeModal();
      state.earnedBadges = new Set([11, 12, 13, 14, 15]);
      state.collectionUnlocked = false;
      state.activeTab = "explore";
      state.selectedSpotId = 10;
      state.verifyingStep = 0;
      updateStaticChrome();
      renderApp();
      setTimeout(() => {
        const vp = document.getElementById("phone-viewport");
        const f5 = document.getElementById("f5-verify-section");
        if (vp && f5) {
          vp.scrollTo({ top: f5.offsetTop - 20, behavior: "smooth" });
        }
      }, 80);
      showToast(`🎯 ${L().toastScene3}`, "success");
    }

    function simulateAntiCheatReject() {
      const ui = L();
      openModal(`
        <div class="space-y-4">
          <div class="w-16 h-16 mx-auto rounded-3xl bg-rose-100 text-rose-600 flex items-center justify-center text-3xl">
            🛡️
          </div>
          <div>
            <span class="px-3 py-1 rounded-full bg-rose-100 text-rose-700 text-[10px] font-extrabold tracking-wider">
              ${ui.modalAntiCheatBadge}
            </span>
            <h3 class="text-lg font-extrabold text-slate-900 mt-2">${ui.modalAntiCheatTitle}</h3>
          </div>
          <div class="text-start bg-slate-50 rounded-2xl p-3 border border-slate-200 space-y-1.5 text-xs">
            <div class="flex justify-between text-emerald-700 font-bold">
              <span>${ui.antiCheatStep1}</span>
              <span>${ui.antiCheatPass} ✓</span>
            </div>
            <div class="flex justify-between text-emerald-700 font-bold">
              <span>${ui.antiCheatStep2}</span>
              <span>${ui.antiCheatPass} ✓</span>
            </div>
            <div class="flex justify-between text-rose-600 font-extrabold">
              <span>${ui.antiCheatStep3}</span>
              <span>${ui.antiCheatFail} ✕</span>
            </div>
          </div>
          <p class="text-xs text-slate-600 leading-relaxed">${ui.antiCheatDesc}</p>
          <button
            onclick="closeModal()"
            class="w-full py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs cursor-pointer"
          >
            ${ui.understoodBtn}
          </button>
        </div>
      `);
    }

    function resetAllDemoData() {
      closeModal();
      state.activeTab = "explore";
      state.selectedCategory = "ALL";
      state.selectedSpotId = null;
      state.quizAnswers = {};
      state.quizResult = null;
      state.earnedBadges = new Set();
      state.collectionUnlocked = false;
      state.verifyingStep = 0;
      updateStaticChrome();
      renderApp();
      showToast(`🔄 ${L().toastReset}`, "info");
    }

    function openMobilePresenter() {
      document.getElementById("presenter-sidebar").classList.add("mobile-open");
    }

    function closeMobilePresenter() {
      document.getElementById("presenter-sidebar").classList.remove("mobile-open");
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderPresenterLanguageGrid();
      updateStaticChrome();
      renderApp();
    });
  </script>
</body>
</html>
